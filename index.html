<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Coding&amp;Color</title>
</head>
<body>
  <!-- inizio della pagina con messaggio di benvenuto e data-->
  <div id="header">
    <div id="saluto">Oggi è un bel giorno!</div>
    <div id="title">
      <h1>CODICI e COLORI</h1>
    </div>
  </div>

  <!--zona dove vengono inseriti i numeri  -->
  <div id="input">
    <label for="inNumber">Inserisci un numero (0–255):</label>
    <input type="number" id="inNumber" placeholder="inserisci un numero" min="0" max="255">
    <button type="button" id="btnElabora" onclick="elabora()">Elabora</button>
    <button type="button" id="btnCancella" onclick="reset()">Cancella</button>
  </div>

  <!-- zona dedicata ai messaggi per capire coem è andata la verifica  -->
  <div id="output">
    <p id="outText">Output</p>
    <p id="error">Errori</p>
  </div>

  <script>
    //iInizializzazione della pagina
    console.log("verifica esecuzione");

    const d = new Date();
    console.log("data: ", d);
    document.getElementById("saluto").innerHTML = "Oggi è il \\ " + d.toLocaleString("it-IT");

    // vettore che contiene i dati rgb
    let colori = [];

    // verifica se il numero inserito è un numero che puo essere nel range dell'rgb
    function elabora() {
      const valore = document.getElementById("inNumber").value.trim();
      const numero = Number(valore);
      const outText = document.getElementById("outText");
      const error = document.getElementById("error");

      if (valore === "" || Number.isNaN(numero) || !Number.isInteger(numero) || numero < 0 || numero > 255) {
        error.innerHTML = "\\ Il numero inserito non rispetta il criterio";
        return;
      }

      error.innerHTML = "";
      colori.push(numero);
      console.log(colori);
      outText.innerHTML = "\\ Numero inserito: " + numero;

      if (colori.length === 3) {
        const nuovoColore = "rgb(" + colori[0] + ", " + colori[1] + ", " + colori[2] + ")";
        outText.innerHTML = "\\ TESTO COLORATO";
        outText.style.color = nuovoColore;
        colori = [];
      }
    }

    //  resetta tutto a zero 
    function reset() {
      colori = [];
      document.getElementById("inNumber").value = "";
      document.getElementById("outText").innerHTML = "Output";
      document.getElementById("outText").style.color = "";
      document.getElementById("error").innerHTML = "";
    }
  </script>
</body>
</html>
